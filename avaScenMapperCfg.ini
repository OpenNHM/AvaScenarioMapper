# --------------------------- Avalanche Scenario Mapper --------------------------- #
#
# Purpose :
#   Filters avaDirectoryResults.parquet into scenario-specific subsets
#   for visualization, mapping, and publication.
#
# Input  :
#   12_avaDirectory/avaDirectoryResults.parquet
#
# Output :
#   13_avaScenMaps/avaScen_<Scenario>/avaScen_<Scenario>.*
#   optional master outputs depending on [OUTPUT]
#
# Workflow context :
#   Consumes Avalanche Directory results and prepares
#   scenario-specific subsets for visualization and dissemination.
#
# Author :
#   Christoph Hesselbach
#
# Institution :
#   Austrian Research Centre for Forests (BFW)
#   Department of Natural Hazards | Snow and Avalanche Unit
#
# Version :
#   2026-03
#
# ---------------------------------------------------------------------------------- #

# ─────────────────────────────────────────────────────────────
# WORKFLOW CONTROL
# ─────────────────────────────────────────────────────────────
[WORKFLOW]

# Diagnostic mode:
#   True  -> list available attributes in avaDirectoryResults and exit
#   False -> run the mapper normally
checkAvaDirResult = False

# Create vector scenario outputs (Parquet, GPKG, GeoJSON, CSV)
mapScenFeatures = True

# Create merged scenario TIFFs in one subdirectory per scenario
mapScenRasters = False


# Placeholder for future external CAAML integration
mapperUseCaaml = False

# Optional suffix for master output name
# Final master name pattern:
#   avaScen_<Region>_<masterSuffix>
masterSuffix =

# Legacy free-form suffix. Used only when masterSuffix is empty.
# Final legacy master name pattern:
#   avaScen_<Region><mapperMasterPrefix>
mapperMasterPrefix =

# Logging level:
#   DEBUG, INFO, WARNING, ERROR
logLevel = INFO



# ─────────────────────────────────────────────────────────────
# PATH DEFINITIONS
# ─────────────────────────────────────────────────────────────
[PATHS]

# Explicit input path
avaDirectoryResults = 
# Explicit output directory
avaScenMapsDir = 


# ─────────────────────────────────────────────────────────────
# OUTPUT CONFIGURATION
# ─────────────────────────────────────────────────────────────
[OUTPUT]

# Output modes:
#   scenarioOnly      -> write only per-scenario outputs
#   scenarioAndMaster -> write scenarios, then build master
#   masterOnly        -> build only master outputs
outputMode = scenarioOnly

# Columns to remove from final outputs if present
#   Example:
#   deleteColumns = sourceRegion, sourceFile
deleteColumns =

# Add scenarioName field to final outputs
addScenarioNameField = True

# Master duplicate handling:
#   True  -> allow identical features from different scenarios multiple times
#   False -> merge exact duplicates across scenarios in master
allowScenarioDuplicatesInMaster = False

# Allowed file types:
#   parquet, gpkg, geojson, csv
#
# Notes:
#   parquet = canonical / robust internal format
#   gpkg    = GIS-friendly
#   geojson = portable but can get large
#   csv     = no geometry unless writeScenarioCsvWkt = True
scenarioFileTypes = parquet, gpkg
masterFileTypes = parquet, gpkg

# CSV geometry option:
#   False -> drop geometry in CSV
#   True  -> export geometry as WKT
writeScenarioCsvWkt = False


# ─────────────────────────────────────────────────────────────
# SCENARIO RASTER CONFIGURATION
# ─────────────────────────────────────────────────────────────
[SCENARIORASTERS]

# Raster path columns to merge; use "all" or a comma-separated list
mapTypes = pathZdelta, pathTravelanglemax, pathTravellengthmax

# Output grid settings
resolution = 10
nodata = -9999

# Optional fixed bounds: xmin, ymin, xmax, ymax
# Leave empty to use the union of all scenario rasters
extent =

# Optional value handling
relTo100 = False
ignoreZero = False

# Replace existing scenario TIFFs
overwrite = False


# ─────────────────────────────────────────────────────────────
# OPTIONAL SUBSET (SPATIAL PRE-FILTER)
# ─────────────────────────────────────────────────────────────
[SUBSET]

# Enable spatial subset before filtering
enableSubsetAreaMask = False

# Logical name of subset area (used for naming only)
subsetAreaName =

# Path to mask geometry (GeoJSON / GPKG)
# Example: /path/to/mask.geojson
subsetAreaPath =

# Output directory for the subset AvaDirectory files
# Example: /path/to/12_avaDirectory/<subset>/
subsetAvaDirectoryDir =

# Supported values: parquet, gpkg, geojson, csv
subsetAvaDirectoryFileTypes = parquet


# ─────────────────────────────────────────────────────────────
# SCENARIO DEFINITIONS
# ─────────────────────────────────────────────────────────────
#
# Each [FILTER.<name>] defines one independent scenario.
#
# All active scenarios must be listed in:
#   [FILTER]
#   filters = scenA, scenB, scenC
#
# Available filter keys:
#
# Region:
#   LKGebiet
#   LKGebietID
#   LWDGebietID
#   regionMode = or / and
#
# Scenario:
#   subC
#   sector
#   flow
#   elevMin
#   elevMax
#
# Legend:
#   AvaDistributionPotential
#   AvaSizePotential
#
# Deduplication:
#   applySingleRsizeRule
#
# Current dedup logic:
#   simple robust rSize-based deduplication
#   -> sort descending by rSize
#   -> drop duplicates by PRA/scenario context
#
# ---------------------------------------------------------------------------------- #

[FILTER]
filters = scenA

# Global elevation filter mode for all scenarios:
#   True / False -> existing elevMin/elevMax band filtering
#   False / True -> filter praElevMean between elevMin and elevMax
#   False / False -> disable elevation filtering
filterElevBand = True
filterElevMean = False

[FILTER.scenA]

# Human-readable output / reporting name
name = scenA

# ------------------ Region filter ------------------ #

# Administrative region names
LKGebiet =

# Administrative region IDs (integer, comma separated if multiple)
LKGebietID =

# Forecast / warning region IDs (string, comma separated if multiple)
LWDGebietID =

# Combine provided region filters:
#   or  -> union
#   and -> intersection
#
# Leave empty if no region filters are used.
# Recommended default when region filters are used:
# regionMode = or
regionMode =


# ------------------ Scenario filter ------------------ #

# Subcatchment ID(s)
subC =

# Aspect / release direction
#    values: N, E, S, W
sector =

# Flow regime
#   values: dry, wet
flow = dry

# Elevation band in meters above sea level
#   min, max values: 1800, 2000, 2200, 2400, 5000
elevMin = 2000
elevMax = 5000


# ------------------ Legend filter ------------------ #

# Avalanche distribution potential
#   values: very high, high, moderate, low
AvaDistributionPotential = very high

# Reference avalanche size class
#   integer 1–5 depending on matrix definition
AvaSizePotential = 5


# ------------------ Deduplication ------------------ #

# True  -> keep only largest rSize candidate per PRA/scenario context
# False -> keep all matching candidates
applySingleRsizeRule = True

# ---------------- EUREGIO -> clipped ISSW AvaDirectory workflow ---------------- #
#
# Read-only preflight:
#   pixi run check-ava-directory-clips
#
# Full run (creates/reuses clipped TIFFs, then replaces the ISSW parquet):
#   pixi run clip-ava-directory
#
# Edit local_avaDirClipCfg.ini for local selections and overrides. It is loaded
# automatically after this main configuration.
#
# The final parquet is replaced atomically only after every requested TIFF exists.
# An interrupted run can be restarted; completed TIFFs are reused.
# ------------------------------------------------------------------------------- #

[PATHS]
inputParquet = 
clipOutputRoot = 

[SELECTION]
# Comma-separated list. Both rel and res rows are retained in the parquet;
# raster clipping and raster paths are applied only to the res rows.
LKGebietID = 

[RASTERS]
# all_results = all seven currently available FlowPy result rasters.
# all         = all_results plus pathInputpra. Do not use "all" until the
#               model-chain input-PRA source files are available again.
# A comma-separated list of individual path columns is also accepted.
rasterPathColumns = all_results
pathStyle = relative

[FLOWPY_ROOTS]
# NTirol and STirol are mapped internally to LKRegion Tirol and Südtirol.
NTirol = 
STirol = 
Trentino = 

[PROCESSING]
maxWorkers = 16
maxPendingJobs = 64
logEverySeconds = 30

# False makes a restarted run reuse TIFFs already present below clipOutputRoot.
# Set True only when every clipped TIFF must be regenerated from its source.
overwriteClips = False

# The current avaDirectoryResults_issw.parquet contains regional source paths,
# so the completed workflow must atomically replace it.
overwriteParquet = True
